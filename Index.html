<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Match - By Mehtab</title>
<style>
body{font-family:Arial;background:#fff5f5;text-align:center;padding:20px}
.card{background:white;padding:20px;border-radius:15px;max-width:400px;margin:auto;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
select,button{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#d32f2f;color:white;border:none;font-weight:bold}
.result{margin-top:15px;padding:15px;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>🩸 Blood Match by Mehtab</h2>
<label>Donor Blood Group</label>
<select id="donor"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
<label>Recipient Blood Group</label>
<select id="recp"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
<button onclick="check()">Check Compatibility</button>
<div id="out" class="result"></div>
</div>
<script>
function check(){
let d=document.getElementById('donor').value;
let r=document.getElementById('recp').value;
let map={
"O-":["A+","A-","B+","B-","AB+","AB-","O+","O-"],
"O+":["A+","B+","AB+","O+"],
"A-":["A+","A-","AB+","AB-"],
"A+":["A+","AB+"],
"B-":["B+","B-","AB+","AB-"],
"B+":["B+","AB+"],
"AB-":["AB+","AB-"],
"AB+":["AB+"]
};
let out=document.getElementById('out');
if(map[d].includes(r)){out.style.background="#c8e6c9";out.innerHTML="✅ Compatible<br>"+d+" can donate to "+r;}
else{out.style.background="#ffcdd2";out.innerHTML="❌ Not Compatible<br>"+d+" cannot donate to "+r;}
}
</script>
</body>
</html>
